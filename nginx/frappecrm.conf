# ========================================================
#   Nginx Production Configuration for Frappe CRM Azerbaijan
# ========================================================
# Bu fayl host serverində Nginx quraşdırmaq istəyən istifadəçilər üçündür.
# Əgər domen adınız varsa (məsələn: crm.example.az) və ya SSL (HTTPS)
# sertifikatı qoşmaq istəyirsinizsə, bu konfiqurasiyadan istifadə edin.
#
# QURAŞDIRILMA QAYDASI:
# 1. Bu faylı /etc/nginx/sites-available/frappecrm.conf qovluğuna kopyalayın:
#    sudo cp nginx/frappecrm.conf /etc/nginx/sites-available/frappecrm.conf
#
# 2. Fayl daxilində 'server_name' yerinə öz domen adınızı və ya IP-nizi yazın:
#    server_name crm.example.az;
#
# 3. Saytı aktivləşdirin və Nginx-i yenidən başladın:
#    sudo ln -s /etc/nginx/sites-available/frappecrm.conf /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
# 4. Pulsuz Let's Encrypt SSL (HTTPS) əlavə etmək üçün:
#    sudo certbot --nginx -d crm.example.az
# ========================================================

upstream frappe_crm_upstream {
    server 127.0.0.1:8080 fail_timeout=0;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name localhost crm.example.az; # Öz domeninizlə əvəzləyin

    # Böyük fayllar və loqoların yüklənməsi üçün limit
    client_max_body_size 50M;
    client_body_buffer_size 16k;

    # Loq faylları
    access_log /var/log/nginx/frappecrm_access.log;
    error_log /var/log/nginx/frappecrm_error.log;

    # Gzip sıxılma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    location / {
        proxy_pass http://frappe_crm_upstream;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Frappe-Site-Name frontend;

        # WebSocket dəstəyi
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
        proxy_redirect off;
    }

    # Statik fayllar üçün keşləmə
    location ~* ^/assets/.*\.(css|js|woff2|woff|ttf|svg|png|jpg|jpeg|gif|ico)$ {
        proxy_pass http://frappe_crm_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }
}
